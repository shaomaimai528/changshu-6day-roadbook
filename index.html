<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#17343a">
  <title>常熟出发 6 天 5 晚自驾地图路书 | 乌镇 · 诸暨 · 横店 · 绍兴 · 嘉兴</title>
  <meta name="description" content="常熟出发的 6 天 5 晚自驾地图路书：乌镇、诸暨五泄、西施故里、横店、绍兴东湖与仓桥直街、嘉兴月河老街。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./leaflet.css">
  <style>
    :root {
      --ink: #17343a;
      --ink-soft: #31545a;
      --muted: #688186;
      --paper: #f7f5ef;
      --panel: #fffdf8;
      --panel-strong: #ffffff;
      --line: #d9e3e0;
      --line-strong: #b8cbc7;
      --teal: #197f7b;
      --teal-soft: #d9f0ec;
      --orange: #d97725;
      --orange-soft: #fff0dd;
      --gold: #b8872d;
      --gold-soft: #fff5d9;
      --red: #bf5546;
      --red-soft: #ffe7e2;
      --blue: #2f6ca6;
      --blue-soft: #e5f0fb;
      --purple: #7864ae;
      --purple-soft: #eee9ff;
      --green: #4b8f62;
      --green-soft: #e2f3e5;
      --brown: #8b6447;
      --brown-soft: #f4e7dc;
      --shadow: 0 22px 58px rgba(21, 54, 58, 0.16);
      --shadow-soft: 0 10px 28px rgba(21, 54, 58, 0.10);
      --radius: 12px;
      --rail: 390px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.62;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid rgba(25, 127, 123, 0.38);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr);
      height: 100dvh;
      min-height: 100svh;
    }

    .rail {
      position: relative;
      z-index: 800;
      display: flex;
      min-width: 0;
      height: 100dvh;
      min-height: 100svh;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(247, 245, 239, 0.98)),
        radial-gradient(circle at 8% 4%, rgba(217, 240, 236, 0.72), transparent 22rem);
      box-shadow: 12px 0 34px rgba(28, 58, 61, 0.08);
      overflow: hidden;
    }

    .rail-header {
      padding: 22px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.9);
      backdrop-filter: blur(12px);
    }

    .brand-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kicker {
      margin: 0 0 3px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 7px;
      color: var(--ink);
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.14;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .overview-button,
    .day-button,
    .stop-button,
    .option-button,
    .photo-button,
    .sheet-handle {
      appearance: none;
      border: 0;
      cursor: pointer;
    }

    .overview-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: var(--panel-strong);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .overview-button:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .overview-button svg,
    .line-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .trip-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 15px;
    }

    .stat {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.74);
    }

    .stat b {
      display: block;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .rail-scroll {
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .day-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 14px 12px 22px;
      list-style: none;
    }

    .day-card {
      position: relative;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      padding: 11px 11px 11px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.76);
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .day-card:hover {
      border-color: var(--day-color);
      background: #fff;
      transform: translateX(2px);
    }

    .day-card.is-active {
      border-color: var(--day-color);
      background: var(--day-soft);
      box-shadow: inset 3px 0 0 var(--day-color);
    }

    .day-badge {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      align-self: start;
      border: 1px solid color-mix(in srgb, var(--day-color) 55%, white);
      border-radius: 50%;
      background: #fff;
      color: var(--day-color);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 5px 13px rgba(21, 54, 58, 0.08);
    }

    .day-badge small {
      display: block;
      font-size: 8px;
      letter-spacing: 0.03em;
    }

    .day-main {
      min-width: 0;
    }

    .day-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .day-heading strong {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
    }

    .day-heading em {
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
      white-space: nowrap;
    }

    .day-route {
      display: block;
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .day-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }

    .day-meta span {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      height: 100dvh;
      min-height: 100svh;
      background:
        linear-gradient(135deg, rgba(231, 242, 239, 0.94), rgba(246, 239, 222, 0.92));
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #dfe9e4;
    }

    .map-topbar {
      position: absolute;
      z-index: 500;
      top: 18px;
      right: 18px;
      left: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .map-title,
    .map-actions {
      pointer-events: auto;
    }

    .map-title {
      max-width: min(540px, calc(100% - 220px));
      padding: 10px 13px;
      border: 1px solid rgba(216, 226, 222, 0.88);
      border-radius: 10px;
      background: rgba(255, 253, 248, 0.92);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .map-title strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
    }

    .map-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .map-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .map-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid rgba(216, 226, 222, 0.9);
      border-radius: 9px;
      background: rgba(255, 253, 248, 0.94);
      box-shadow: var(--shadow-soft);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .map-action:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .map-action[aria-pressed="true"] {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .map-legend {
      position: absolute;
      z-index: 500;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      max-width: min(470px, calc(100% - 36px));
      padding: 8px 10px;
      border: 1px solid rgba(216, 226, 222, 0.88);
      border-radius: 9px;
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-soft);
      color: var(--muted);
      font-size: 10px;
      backdrop-filter: blur(12px);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 50%;
      background: currentColor;
    }

    .map-status {
      position: absolute;
      z-index: 550;
      top: 76px;
      right: 18px;
      max-width: min(420px, calc(100% - 36px));
      padding: 9px 11px;
      border: 1px solid rgba(191, 85, 70, 0.28);
      border-radius: 9px;
      background: rgba(255, 231, 226, 0.96);
      box-shadow: var(--shadow-soft);
      color: #7d382f;
      font-size: 12px;
    }

    .map-status[hidden] {
      display: none;
    }

    .leaflet-container {
      font-family: inherit;
    }

    .leaflet-control-attribution {
      margin: 0 5px 5px 0 !important;
      border-radius: 6px 0 0 0;
      background: rgba(255, 253, 248, 0.82) !important;
      color: var(--muted) !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a {
      color: var(--teal) !important;
    }

    .leaflet-control-zoom {
      margin-top: 102px !important;
      margin-right: 18px !important;
      border: 1px solid rgba(216, 226, 222, 0.9) !important;
      border-radius: 9px !important;
      box-shadow: var(--shadow-soft) !important;
      overflow: hidden;
    }

    .leaflet-control-zoom a {
      color: var(--ink-soft) !important;
      background: rgba(255, 253, 248, 0.96) !important;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      color: var(--ink);
      background: var(--panel);
    }

    .leaflet-popup-content-wrapper {
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 12px;
    }

    .leaflet-popup-content strong {
      display: block;
      font-size: 14px;
    }

    .route-line {
      transition: opacity 160ms ease, stroke-opacity 160ms ease;
    }

    .distance-label {
      border: 1px solid rgba(21, 54, 58, 0.13);
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.94);
      box-shadow: 0 4px 12px rgba(21, 54, 58, 0.12);
      color: var(--ink);
      font-size: 10px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      padding: 4px 6px;
    }

    .stop-marker,
    .stay-marker {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 5px 14px rgba(21, 54, 58, 0.24);
      color: #fff;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .stop-marker {
      background: var(--marker-color);
      font-size: 12px;
    }

    .stay-marker {
      background: var(--ink);
      font-size: 16px;
    }

    .stay-marker::after {
      content: "";
      position: absolute;
      right: 7px;
      bottom: 4px;
      left: 7px;
      height: 4px;
      border-radius: 999px;
      background: #f4c34f;
    }

    .marker-dim {
      opacity: 0.2;
    }

    .marker-active {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.88));
    }

    .detail-panel {
      position: absolute;
      z-index: 520;
      top: 86px;
      bottom: 18px;
      left: 18px;
      display: flex;
      width: min(430px, calc(100% - 36px));
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .detail-panel[hidden] {
      display: none;
    }

    .detail-scroll {
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      scrollbar-width: thin;
      padding: 16px 17px 24px;
    }

    .detail-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink-soft);
      cursor: pointer;
    }

    .detail-kicker {
      color: var(--teal);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .detail-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .detail-panel h2 {
      margin: 2px 0 0;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.2;
    }

    .detail-summary {
      margin: 9px 0 0;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .detail-route {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 12px;
    }

    .detail-route span {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: #175e5b;
      font-size: 11px;
      font-weight: 800;
    }

    .detail-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .detail-section h3 {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 9px;
      color: var(--ink);
      font-size: 13px;
    }

    .timeline {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .timeline li {
      position: relative;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 10px;
      padding-bottom: 12px;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      top: 7px;
      bottom: -2px;
      left: 58px;
      width: 1px;
      background: var(--line);
    }

    .timeline li:last-child::before {
      display: none;
    }

    .timeline time {
      color: var(--day-color, var(--teal));
      font-size: 11px;
      font-weight: 900;
      line-height: 1.45;
    }

    .timeline strong {
      display: block;
      color: var(--ink);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .timeline span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .info-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .info-list li {
      position: relative;
      padding-left: 15px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .info-list li::before {
      content: "";
      position: absolute;
      top: 0.62em;
      left: 2px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--day-color, var(--teal));
    }

    .info-list strong {
      color: var(--ink);
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .option-button {
      min-height: 102px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      text-align: left;
    }

    .option-button:hover,
    .option-button.is-active {
      border-color: var(--day-color);
      background: var(--day-soft);
    }

    .option-button strong {
      display: block;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.35;
    }

    .option-button span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.45;
    }

    .reservation-list {
      display: grid;
      gap: 7px;
    }

    .reservation {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.75);
    }

    .reservation-icon {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 7px;
      background: var(--gold-soft);
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
    }

    .reservation strong {
      display: block;
      color: var(--ink);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .reservation span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.45;
    }

    .photo-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .photo-item {
      position: relative;
      min-height: 104px;
      margin: 0;
      border-radius: 9px;
      overflow: hidden;
      background: var(--paper);
    }

    .photo-item img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 104px;
      object-fit: cover;
      transition: transform 180ms ease;
    }

    .photo-item:hover img {
      transform: scale(1.03);
    }

    .photo-item figcaption {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 16px 7px 6px;
      background: linear-gradient(transparent, rgba(15, 35, 38, 0.78));
      color: #fff;
      font-size: 10px;
      line-height: 1.3;
    }

    .photo-button {
      position: absolute;
      inset: 0;
      width: 100%;
      background: transparent;
    }

    .lightbox {
      position: fixed;
      z-index: 2000;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(13, 30, 32, 0.84);
      backdrop-filter: blur(8px);
    }

    .lightbox[hidden] {
      display: none;
    }

    .lightbox img {
      max-width: min(1180px, 96vw);
      max-height: 82vh;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
    }

    .sheet-handle {
      display: none;
    }

    .mobile-detail {
      display: none;
    }

    .empty-state {
      display: grid;
      min-height: 160px;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1100px) {
      :root {
        --rail: 340px;
      }

      .detail-panel {
        width: min(390px, calc(100% - 36px));
      }

      .map-title {
        max-width: calc(100% - 210px);
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: hidden;
      }

      .app {
        display: block;

      var dom = {
        dayList: document.getElementById("dayList"),
        detailPanel: document.getElementById("detailPanel"),
        detailContent: document.getElementById("detailContent"),
        mapTitle: document.getElementById("mapTitle"),
        mapStatus: document.getElementById("mapStatus"),
        legend: document.getElementById("legend"),
        overviewButtons: [
          document.getElementById("overviewButton"),
          document.getElementById("mapOverviewButton")
        ],
        toggleDetailButton: document.getElementById("toggleDetailButton"),
        sheetHandle: document.getElementById("sheetHandle"),
        lightbox: document.getElementById("lightbox"),
        lightboxImage: document.getElementById("lightboxImage"),
        lightboxClose: document.getElementById("lightboxClose")
      };

      var state = {
        activeDayId: null,
        activeOptionId: null,
        activeSelection: null,
        detailOpen: false,
        mapReady: false,
        tileFailures: 0,
        tileSuccesses: 0
      };

      var map;
      var tileLayer;
      var dayLayerGroups = {};
      var segmentLayers = [];
      var markerRecords = [];
      var allBounds;

      var dayById = TRIP.days.reduce(function (acc, day) {
        acc[day.id] = day;
        return acc;
      }, {});

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char];
        });
      }

      function colorFor(dayId) {
        return DAY_COLORS[dayId] || DAY_COLORS.d1;
      }

      function iconSvg(name) {
        var icons = {
          route: '<path d="M4 6.5 10 4l4 2.5L20 4v13.5L14 20l-4-2.5L4 20Z"/><path d="M10 4v13.5M14 6.5V20"/>',
          clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.8 2"/>',
          car: '<path d="M5 16h14M7 16v2M17 16v2M6 16l1.2-5h9.6L18 16"/><path d="M7.5 13h9"/>',
          pin: '<path d="M12 21s6-5.2 6-11a6 6 0 0 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/>',
          bed: '<path d="M4 19V7"/><path d="M4 11h16v8"/><path d="M4 15h16"/><path d="M8 11V8h6a3 3 0 0 1 3 3v0"/>',
          food: '<path d="M7 4v7a3 3 0 0 0 6 0V4"/><path d="M7 6h6"/><path d="M12 4v16"/><path d="M17 4v16"/><path d="M17 4c2 1.5 2 4.5 0 6"/>',
          ticket: '<path d="M4 7h16v4a2 2 0 0 0 0 4v2H4v-2a2 2 0 0 0 0-4Z"/><path d="M9 7v10"/>',
          camera: '<path d="M4 8h3l2-3h6l2 3h3v10H4Z"/><circle cx="12" cy="13" r="3"/>',
          info: '<circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/>'
        };
        return '<svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true">' + (icons[name] || icons.info) + '</svg>';
      }

      function renderLegend() {
        var html = TRIP.days.map(function (day) {
          var c = colorFor(day.id);
          return '<span class="legend-item"><i class="legend-dot" style="color:' + c.color + '"></i>' + day.date + '</span>';
        }).join("");
        dom.legend.innerHTML = html;
      }

      function renderDayList() {
        dom.dayList.innerHTML = TRIP.days.map(function (day) {
          var c = colorFor(day.id);
          return (
            '<li>' +
              '<button class="day-button day-card" type="button" data-day="' + day.id + '" style="--day-color:' + c.color + ';--day-soft:' + c.soft + '">' +
                '<span class="day-badge">' + escapeHtml(day.date) + '<small>' + escapeHtml(day.weekday) + '</small></span>' +
                '<span class="day-main">' +
                  '<span class="day-heading"><strong>' + escapeHtml(day.title) + '</strong><em>' + escapeHtml(day.duration) + '</em></span>' +
                  '<span class="day-route">' + escapeHtml(day.route) + '</span>' +
                  '<span class="day-meta"><span>' + escapeHtml(day.distance) + '</span><span>住' + escapeHtml(day.stay) + '</span></span>' +
                '</span>' +
              '</button>' +
            '</li>'
          );
        }).join("");

        dom.dayList.addEventListener("click", function (event) {
          var button = event.target.closest("[data-day]");
          if (!button) return;
          selectDay(button.getAttribute("data-day"), true);
        });
      }

      function popupHtml(title, detail) {
        return '<strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(detail || "") + '</span>';
      }

      function distanceLabelIcon(text) {
        return L.divIcon({
          className: "",
          html: '<span class="distance-label">' + escapeHtml(text) + '</span>',
          iconSize: null,
          iconAnchor: [28, 12]
        });
      }

      function stopIcon(dayId, stop, index, isActive) {
        var c = colorFor(dayId);
        var label = stop.kind === "start" ? "始" : stop.kind === "end" ? "终" : stop.kind === "food" ? "食" : stop.kind === "optional" ? "选" : (index + 1);
        return L.divIcon({
          className: "marker-wrap" + (state.activeDayId && !isActive ? " marker-dim" : "") + (isActive ? " marker-active" : ""),
          html: '<span class="stop-marker" style="--marker-color:' + c.color + '">' + escapeHtml(label) + '</span>',
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -14]
        });
      }

      function stayIcon(isActive) {
        return L.divIcon({
          className: "marker-wrap" + (state.activeDayId && !isActive ? " marker-dim" : "") + (isActive ? " marker-active" : ""),
          html: '<span class="stay-marker">住</span>',
          iconSize: [34, 34],
          iconAnchor: [17, 17],
          popupAnchor: [0, -16]
        });
      }

      function linePoints(segment) {
        var from = findStop(segment.from);
        var to = findStop(segment.to);
        if (!from || !to) return [];
        var start = [from.lat, from.lng];
        var end = [to.lat, to.lng];
        var bend = segment.curve;
        if (bend === undefined) bend = 0.15;
        var mid = [
          (start[0] + end[0]) / 2 + (end[1] - start[1]) * bend * 0.04,
          (start[1] + end[1]) / 2 - (end[0] - start[0]) * bend * 0.04
        ];
        return [start, mid, end];
      }

      function findStop(name) {
        var found = null;
        TRIP.days.some(function (day) {
          return day.stops.some(function (stop) {
            if (stop.name === name) {
              found = stop;
              return true;
            }
            return false;
          });
        });
        return found;
      }

      function initMap() {
        map = L.map("map", {
          zoomControl: true,
          attributionControl: true,
          preferCanvas: true,
          worldCopyJump: true
        }).setView([30.55, 120.55], 7);

        var shortLabels = L.tileLayer("https://basemaps.cartocdn.com/zh_cn_voyager/{z}/{x}/{y}.png", {
          subdomains: "abcd",
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        });

        shortLabels.on("tileerror", function () {
          state.tileFailures += 1;
          updateMapStatus();
        });
        shortLabels.on("tileload", function () {
          state.tileSuccesses += 1;
          if (state.tileSuccesses > 3) {
            dom.mapStatus.hidden = true;
          }
        });

        tileLayer = shortLabels;
        tileLayer.addTo(map);
        state.mapReady = true;
        renderMapLayers();
      }

      function updateMapStatus() {
        if (state.tileSuccesses > 3) return;
        dom.mapStatus.hidden = false;
        dom.mapStatus.textContent = "在线底图暂时不可用，路线、距离和行程详情仍可正常查看。";
      }

      function renderMapLayers() {
        Object.keys(dayLayerGroups).forEach(function (key) {
          if (dayLayerGroups[key]) map.removeLayer(dayLayerGroups[key]);
        });
        dayLayerGroups = {};
        segmentLayers = [];
        markerRecords = [];

        TRIP.days.forEach(function (day) {
          var group = L.layerGroup().addTo(map);
          dayLayerGroups[day.id] = group;
          var c = colorFor(day.id);

          day.segments.forEach(function (segment) {
            var points = linePoints(segment);
            if (!points.length) return;
            var line = L.polyline(points, {
              color: c.color,
              weight: 5,
              opacity: 0.86,
              lineCap: "round",
              lineJoin: "round",
              className: "route-line"
            }).addTo(group);
            line.bindPopup(popupHtml(segment.from + " → " + segment.to, segment.distance + " · " + segment.time));
            line.on("click", function () {
              selectDay(day.id, true, segment);
            });
            if (segment.option) {
              line.setStyle({ dashArray: "7 8", weight: 4 });
            }
            segmentLayers.push({ dayId: day.id, segment: segment, layer: line });

            var labelPoint = points[Math.floor(points.length / 2)];
            var label = L.marker(labelPoint, {
              icon: distanceLabelIcon(segment.distance),
              interactive: true,
              keyboard: false
            }).addTo(group);
            label.bindPopup(popupHtml(segment.from + " → " + segment.to, segment.distance + " · " + segment.time));
            label.on("click", function () {
              selectDay(day.id, true, segment);
            });
          });

          day.stops.forEach(function (stop, index) {
            var isActive = state.activeDayId === day.id;
            var icon = stop.stay ? stayIcon(isActive) : stopIcon(day.id, stop, index, isActive);
            var marker = L.marker([stop.lat, stop.lng], {
              icon: icon,
              title: stop.name,
              alt: stop.name,
              riseOnHover: true
            }).addTo(group);
            marker.bindPopup(popupHtml(stop.name, stop.kind === "stay" ? "住宿区 · " + day.date : day.date + " · " + day.title));
            marker.on("click", function () {
              if (stop.stay) {
                selectStay(stop.name, true);
              } else {
                selectDay(day.id, true, stop);
              }
            });
            markerRecords.push({ dayId: day.id, stop: stop, marker: marker, iconBase: stop.stay ? "stay" : "stop" });
          });
        });

        TRIP.stays.forEach(function (stay) {
          var isActive = state.activeSelection && state.activeSelection.type === "stay" && state.activeSelection.id === stay.id;
          var marker = L.marker([stay.lat, stay.lng], {
            icon: stayIcon(isActive),
            title: stay.name,
            alt: stay.name,
            zIndexOffset: 400
          }).addTo(map);
          marker.bindPopup(popupHtml(stay.name, stay.label + " · " + stay.area + " · " + stay.price));
          marker.on("click", function () {
            selectStay(stay.name, true);
          });
          markerRecords.push({ dayId: null, stayId: stay.id, marker: marker, iconBase: "stay" });
        });

        allBounds = L.latLngBounds([]);
        Object.keys(dayLayerGroups).forEach(function (dayId) {
          var bounds = dayLayerGroups[dayId].getLayers().reduce(function (acc, layer) {
            if (layer.getBounds) acc.extend(layer.getBounds());
            if (layer.getLatLng) acc.extend(layer.getLatLng());
            return acc;
          }, L.latLngBounds([]));
          if (bounds.isValid()) allBounds.extend(bounds);
        });
        applyVisualState();
      }

      function selectDay(dayId, openDetail, selection) {
        state.activeDayId = dayId;
        state.activeOptionId = null;
        state.activeSelection = selection ? { type: "stop", id: selection.name || dayId, value: selection } : { type: "day", id: dayId };
        if (openDetail) state.detailOpen = true;
        updateActiveUi();
        renderDetail();
        fitDay(dayId);
        updateOverviewPressed();
      }

      function selectStay(name, openDetail) {
        var stay = TRIP.stays.find(function (item) { return item.name === name; });
        if (!stay) return;
        state.activeDayId = null;
        state.activeSelection = { type: "stay", id: stay.id, value: stay };
        if (openDetail) state.detailOpen = true;
        updateActiveUi();
        renderDetail();
        if (state.mapReady) {
          map.flyTo([stay.lat, stay.lng], Math.max(map.getZoom(), 10), { duration: 0.5 });
        }
        updateOverviewPressed();
      }

      function selectOverview() {
        state.activeDayId = null;
        state.activeOptionId = null;
        state.activeSelection = null;
        state.detailOpen = false;
        updateActiveUi();
        renderDetail();
        if (state.mapReady && allBounds && allBounds.isValid()) {
          map.fitBounds(allBounds.pad(0.12), { animate: true });
        }
        updateOverviewPressed();
      }

      function fitDay(dayId) {
        if (!state.mapReady) return;
        var group = dayLayerGroups[dayId];
        if (!group) return;
        var bounds = L.latLngBounds([]);
        group.getLayers().forEach(function (layer) {
          if (layer.getBounds) bounds.extend(layer.getBounds());
          if (layer.getLatLng) bounds.extend(layer.getLatLng());
        });
        if (bounds.isValid()) {
          map.fitBounds(bounds.pad(0.22), { maxZoom: 11, animate: true });
        }
      }

      function selectOption(dayId, optionId) {
        var day = dayById[dayId];
        if (!day) return;
        state.activeDayId = dayId;
        state.activeOptionId = optionId;
        var option = (day.options || []).find(function (item) { return item.id === optionId; });
        state.activeSelection = { type: "option", id: optionId, value: option };
        state.detailOpen = true;
        updateActiveUi();
        renderDetail();
        fitOption(dayId, optionId);
        updateOverviewPressed();
      }

      function fitOption(dayId, optionId) {
        if (!state.mapReady) return;
        var day = dayById[dayId];
        if (!day) return;
        var bounds = L.latLngBounds([]);
        day.stops.forEach(function (stop) {
          if (stop.option && stop.option !== optionId) return;
          bounds.extend([stop.lat, stop.lng]);
        });
        if (bounds.isValid()) {
          map.fitBounds(bounds.pad(0.22), { maxZoom: 12, animate: true });
        }
      }

      function updateActiveUi() {
        Array.prototype.forEach.call(dom.dayList.querySelectorAll("[data-day]"), function (button) {
          var active = button.getAttribute("data-day") === state.activeDayId;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
        updateOverviewPressed();
        applyVisualState();
      }

      function updateOverviewPressed() {
        var overview = !state.activeDayId && !state.activeSelection;
        dom.overviewButtons.forEach(function (button) {
          if (!button) return;
          button.setAttribute("aria-pressed", overview ? "true" : "false");
        });
        dom.toggleDetailButton.setAttribute("aria-pressed", state.detailOpen ? "true" : "false");
        dom.detailPanel.hidden = !state.detailOpen;
      }

      function applyVisualState() {
        Object.keys(dayLayerGroups).forEach(function (dayId) {
          var active = !state.activeDayId || state.activeDayId === dayId;
          var c = colorFor(dayId);
          dayLayerGroups[dayId].eachLayer(function (layer) {
            if (layer.setStyle) {
              layer.setStyle({
                opacity: active ? 0.88 : 0.16,
                fillOpacity: active ? 0.2 : 0.04,
                color: c.color
              });
            }
            if (layer.getElement) {
              var el = layer.getElement();
              if (el) el.style.opacity = active ? "1" : "0.22";
            }
          });
        });
        markerRecords.forEach(function (record) {
          var active = !state.activeDayId || record.dayId === state.activeDayId || state.activeSelection && state.activeSelection.type === "stay";
          var el = record.marker.getElement();
          if (el) {
            el.classList.toggle("marker-dim", !active);
            el.classList.toggle("marker-active", Boolean(state.activeDayId && record.dayId === state.activeDayId));
          }
        });
      }

      function renderDetail() {
        if (!state.detailOpen) {
          dom.detailContent.innerHTML = "";
          return;
        }

        if (state.activeSelection && state.activeSelection.type === "stay") {
          renderStayDetail(state.activeSelection.value);
          return;
        }

        if (state.activeSelection && state.activeSelection.type === "option") {
          renderOptionDetail(state.activeDayId, state.activeSelection.value);
          return;
        }

        if (state.activeDayId) {
          renderDayDetail(dayById[state.activeDayId]);
          return;
        }

        renderOverviewDetail();
      }

      function detailHead(day, kicker, title) {
        var c = colorFor(day.id);
        return (
          '<div class="detail-head">' +
            '<div>' +
              '<div class="detail-kicker">' + escapeHtml(kicker) + '</div>' +
              '<h2>' + escapeHtml(title) + '</h2>' +
            '</div>' +
            '<button class="detail-close" type="button" data-close-detail aria-label="关闭详情">×</button>' +
          '</div>'
        );
      }

      function renderDayDetail(day) {
        var c = colorFor(day.id);
        var optionText = day.options ? renderOptions(day) : "";
        var photos = renderPhotos(day.photos);
        dom.detailContent.style.setProperty("--day-color", c.color);
        dom.detailContent.innerHTML =
          detailHead(day, day.date + " · " + day.weekday, day.title) +
          '<p class="detail-summary">' + escapeHtml(day.summary) + '</p>' +
          '<div class="detail-route">' + day.route.split("→").map(function (part) { return '<span>' + escapeHtml(part.trim()) + '</span>'; }).join("") + '</div>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("clock") + '当天时间轴</h3>' +
            '<ol class="timeline">' + day.timeline.map(function (item) {
              return '<li><time>' + escapeHtml(item.time) + '</time><div><strong>' + escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.detail) + '</span></div></li>';
            }).join("") + '</ol>' +
          '</section>' +
          optionText +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("route") + '路线与距离</h3>' +
            '<ul class="info-list">' +
              day.segments.map(function (segment) {
                return '<li><strong>' + escapeHtml(segment.from + " → " + segment.to) + '</strong>：' + escapeHtml(segment.distance) + ' · ' + escapeHtml(segment.time) + '</li>';
              }).join("") +
            '</ul>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("info") + '当天重点</h3>' +
            '<ul class="info-list">' + day.highlights.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join("") + '</ul>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("food") + '沿途美食</h3>' +
            '<ul class="info-list"><li>' + day.food.map(escapeHtml).join("、") + '</li></ul>' +
            '<ul class="info-list"><li><strong>停车：</strong>' + escapeHtml(day.parking) + '</li></ul>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("ticket") + '预约提醒</h3>' +
            renderReservations(day.reservations) +
          '</section>' +
          (photos ? '<section class="detail-section"><h3>' + iconSvg("camera") + '沿途实景</h3>' + photos + '</section>' : '');
        bindDetailEvents();
      }

      function renderOptions(day) {
        return (
          '<section class="detail-section">' +
            '<h3>' + iconSvg("route") + '10/4 二选一方案</h3>' +
            '<div class="option-grid">' +
              day.options.map(function (option) {
                return '<button class="option-button" type="button" data-option="' + option.id + '" data-day-option="' + day.id + '">' +
                  '<strong>' + escapeHtml(option.name) + '</strong>' +
                  '<span>' + escapeHtml(option.detail) + '</span>' +
                '</button>';
              }).join("") +
            '</div>' +
          '</section>'
        );
      }

      function renderOptionDetail(dayId, option) {
        var day = dayById[dayId];
        if (!day || !option) return;
        var c = colorFor(dayId);
        dom.detailContent.style.setProperty("--day-color", c.color);
        dom.detailContent.innerHTML =
          detailHead(day, day.date + " · 方案详情", option.name) +
          '<p class="detail-summary">' + escapeHtml(option.detail) + '</p>' +
          '<div class="detail-route"><span>' + escapeHtml(day.title) + '</span><span>可选方案</span></div>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("info") + '方案亮点</h3>' +
            '<ul class="info-list">' + option.highlights.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join("") + '</ul>' +
          '</section>' +
          renderOptions(day) +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("clock") + '当天其余安排</h3>' +
            '<ol class="timeline">' + day.timeline.slice(0, 2).map(function (item) {
              return '<li><time>' + escapeHtml(item.time) + '</time><div><strong>' + escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.detail) + '</span></div></li>';
            }).join("") + '</ol>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("ticket") + '预约提醒</h3>' +
            renderReservations(day.reservations) +
          '</section>';
        bindDetailEvents();
      }

      function renderStayDetail(stay) {
        dom.detailContent.style.setProperty("--day-color", "#b8872d");
        dom.detailContent.innerHTML =
          '<div class="detail-head">' +
            '<div><div class="detail-kicker">住宿区 · ' + escapeHtml(stay.label) + '</div><h2>' + escapeHtml(stay.name) + '</h2></div>' +
            '<button class="detail-close" type="button" data-close-detail aria-label="关闭详情">×</button>' +
          '</div>' +
          '<p class="detail-summary">' + escapeHtml(stay.area) + ' · ' + escapeHtml(stay.price) + '</p>' +
          '<div class="detail-route"><span>住宿区</span><span>' + escapeHtml(stay.label) + '</span></div>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("bed") + '住宿建议</h3>' +
            '<ul class="info-list">' + stay.advice.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join("") + '</ul>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("car") + '停车与预订</h3>' +
            '<ul class="info-list"><li>' + escapeHtml(stay.parking) + '</li><li>推荐区域：' + escapeHtml(stay.area) + '</li></ul>' +
          '</section>';
        bindDetailEvents();
      }

      function renderOverviewDetail() {
        dom.detailContent.style.setProperty("--day-color", "var(--teal)");
        dom.detailContent.innerHTML =
          '<div class="detail-head">' +
            '<div><div class="detail-kicker">全程总览</div><h2>六天地图中转路线</h2></div>' +
            '<button class="detail-close" type="button" data-close-detail aria-label="关闭详情">×</button>' +
          '</div>' +
          '<p class="detail-summary">单日单程基本 100 公里内，住两景点中间省费用，行程不重复。</p>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("pin") + '三个住宿区</h3>' +
            '<ul class="info-list">' + TRIP.stays.map(function (stay) { return '<li><strong>' + escapeHtml(stay.name) + '</strong>：' + escapeHtml(stay.label + " · " + stay.price) + '</li>'; }).join("") + '</ul>' +
          '</section>' +
          '<section class="detail-section">' +
            '<h3>' + iconSvg("info") + '行程说明</h3>' +
            '<ul class="info-list">' + TRIP.assumptions.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join("") + '</ul>' +
          '</section>';
        bindDetailEvents();
      }

      function renderReservations(items) {
        return '<div class="reservation-list">' + items.map(function (item) {
          var symbol = item.type === "hotel" ? "房" : item.type === "free" ? "免" : "约";
          return '<div class="reservation"><span class="reservation-icon">' + symbol + '</span><div><strong>' + escapeHtml(item.title) + '</strong><span>' + escapeHtml(item.detail) + '</span></div></div>';
        }).join("") + '</div>';
      }

      function renderPhotos(photos) {
        if (!photos || !photos.length) return "";
        return '<div class="photo-strip">' + photos.map(function (photo) {
          return '<figure class="photo-item"><img src="' + escapeHtml(photo.src) + '" alt="' + escapeHtml(photo.alt) + '" loading="lazy" decoding="async"><figcaption>' + escapeHtml(photo.label) + '</figcaption><button class="photo-button" type="button" data-photo="' + escapeHtml(photo.src) + '" data-photo-alt="' + escapeHtml(photo.alt) + '" aria-label="查看' + escapeHtml(photo.label) + '大图"></button></figure>';
        }).join("") + '</div>';
      }

      function bindDetailEvents() {
        var close = dom.detailContent.querySelector("[data-close-detail]");
        if (close) close.addEventListener("click", closeDetail);
        Array.prototype.forEach.call(dom.detailContent.querySelectorAll("[data-option]"), function (button) {
          button.addEventListener("click", function () {
            selectOption(button.getAttribute("data-day-option"), button.getAttribute("data-option"));
          });
          if (state.activeOptionId === button.getAttribute("data-option")) {
            button.classList.add("is-active");
          }
        });
        Array.prototype.forEach.call(dom.detailContent.querySelectorAll("[data-photo]"), function (button) {
          button.addEventListener("click", function () {
            openLightbox(button.getAttribute("data-photo"), button.getAttribute("data-photo-alt"));
          });
        });
      }

      function openLightbox(src, alt) {
        dom.lightboxImage.src = src;
        dom.lightboxImage.alt = alt || "";
        dom.lightbox.hidden = false;
        dom.lightboxClose.focus();
      }

      function closeLightbox() {
        dom.lightbox.hidden = true;
        dom.lightboxImage.removeAttribute("src");
      }

      function closeDetail() {
        state.detailOpen = false;
        updateOverviewPressed();
        renderDetail();
      }

      function toggleDetail() {
        state.detailOpen = !state.detailOpen;
        if (state.detailOpen && !state.activeDayId && !state.activeSelection) {
          renderOverviewDetail();
        }
        updateOverviewPressed();
        renderDetail();
      }

      function handleKeyboard(event) {
        if (event.target && /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
        var index = TRIP.days.findIndex(function (day) { return day.id === state.activeDayId; });
        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          event.preventDefault();
          selectDay(TRIP.days[(index + 1 + TRIP.days.length) % TRIP.days.length].id, true);
        } else if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
          event.preventDefault();
          selectDay(TRIP.days[(index <= 0 ? TRIP.days.length - 1 : index - 1)].id, true);
        } else if (event.key === "Escape") {
          if (!dom.lightbox.hidden) closeLightbox();
          else if (state.detailOpen) closeDetail();
          else selectOverview();
        }
      }

      function bindControls() {
        dom.overviewButtons.forEach(function (button) {
          if (button) button.addEventListener("click", selectOverview);
        });
        dom.toggleDetailButton.addEventListener("click", toggleDetail);
        dom.sheetHandle.addEventListener("click", toggleDetail);
        dom.lightboxClose.addEventListener("click", closeLightbox);
        dom.lightbox.addEventListener("click", function (event) {
          if (event.target === dom.lightbox) closeLightbox();
        });
        document.addEventListener("keydown", handleKeyboard);
      }

      renderLegend();
      renderDayList();
      bindControls();
      renderOverviewDetail();
      updateOverviewPressed();
      initMap();
    })();
  </script>
</body>
</html>
